spring.application.name=salary-management-backend
server.port=${PORT:8080}

# Database Configuration (Defaults to embedded H2 for zero-config local development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:salarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson formatting
spring.jackson.serialization.write-dates-as-timestamps=false
