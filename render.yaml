# Render Blueprint for Full Cloud Stack: Managed PostgreSQL + Spring Boot Backend + React Frontend
databases:
  - name: salary-management-db
    databaseName: salarydb
    user: salaryuser
    plan: free
    region: oregon

services:
  # Spring Boot Backend API
  - type: web
    name: salary-management-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/employees
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: salary-management-db
          property: connectionString

  # React TypeScript Frontend
  - type: web
    name: salary-management-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://salary-management-backend-ec7l.onrender.com
